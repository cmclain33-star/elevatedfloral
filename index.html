<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevated Floral | The Kopachuck Collection</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lora', serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      color: #4a3f35;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft watercolor floral accents */
    .watercolor-left {
      position: absolute;
      top: 8%;
      left: -40px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(248, 200, 208, 0.45) 0%, rgba(248, 200, 208, 0) 70%);
      border-radius: 50%;
      filter: blur(30px);
      z-index: 0;
    }

    .watercolor-right {
      position: absolute;
      bottom: 10%;
      right: -50px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(249, 228, 168, 0.4) 0%, rgba(249, 228, 168, 0) 70%);
      border-radius: 50%;
      filter: blur(35px);
      z-index: 0;
    }

    .watercolor-top {
      position: absolute;
      top: -60px;
      right: 15%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(232, 210, 220, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(25px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.8rem;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.06));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: #5c4a3d;
      margin-bottom: 0.35rem;
      letter-spacing: 0.4px;
    }

    .tagline {
      font-size: 1.05rem;
      color: #7a6a5a;
      margin-bottom: 2.4rem;
      font-style: italic;
    }

    .contact-card {
      background: #fce8ec; /* soft light pink */
      border-radius: 22px;
      padding: 2rem 1.8rem;
      box-shadow: 0 8px 24px rgba(180, 120, 130, 0.12);
      border: 1px solid #f8d5dc;
    }

    .contact-item {
      margin: 1.1rem 0;
      font-size: 1.15rem;
      line-height: 1.55;
    }

    .contact-item a {
      color: #5c4a3d;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .contact-item a:hover {
      color: #8b5a4a;
      border-bottom-color: #c9a090;
    }

    .phone {
      font-weight: 500;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #9a8a7a;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 480px) {
      .logo {
        max-width: 280px;
      }
      h1 {
        font-size: 1.55rem;
      }
      .contact-item {
        font-size: 1.05rem;
      }
      .watercolor-left,
      .watercolor-right {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>
<body>
  <!-- Soft watercolor graphics -->
  <div class="watercolor-left"></div>
  <div class="watercolor-right"></div>
  <div class="watercolor-top"></div>

  <div class="container">
    <img src="logo.png" alt="Elevated Floral - The Kopachuck Collection" class="logo">

    <h1>Elevated Floral</h1>
    <p class="tagline">Handcrafted bouquets of dahlias & sunflowers</p>

    <div class="contact-card">
      <div class="contact-item phone">
        Text or call me at<br>
        <a href="tel:4054768676">405-476-8676</a>
      </div>

      <div class="contact-item">
        <a href="mailto:jessica@elevatedfloral.net">jessica@elevatedfloral.net</a>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Elevated Floral · The Kopachuck Collection
  </footer>
</body>
</html>
