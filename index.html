<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevated Floral | The Kopachuck Collection</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lora', serif;
      background: linear-gradient(160deg, #fdf8f4 0%, #f9f0e8 40%, #f5e6d8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #4a3f35;
      position: relative;
      overflow-x: hidden;
    }

    /* Soft watercolor-style decorative blobs */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      z-index: 0;
    }

    body::before {
      width: 420px;
      height: 420px;
      background: #f8c8d0; /* soft pink */
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 380px;
      height: 380px;
      background: #f9e4a8; /* soft sunflower yellow */
      bottom: -80px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 620px;
      width: 100%;
    }

    .logo {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin: 0 auto 2rem;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.08));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: #5c4a3d;
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .tagline {
      font-size: 1.05rem;
      color: #7a6a5a;
      margin-bottom: 2.5rem;
      font-style: italic;
    }

    .contact-card {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 2rem 1.8rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .contact-item {
      margin: 1.1rem 0;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .contact-item a {
      color: #5c4a3d;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .contact-item a:hover {
      color: #8b5a4a;
      border-bottom-color: #c9a090;
    }

    .phone {
      font-weight: 500;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #9a8a7a;
    }

    @media (max-width: 480px) {
      .logo {
        max-width: 280px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .contact-item {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <img 
      src="https://drive.google.com/uc?export=view&id=1fcLjimVVsZu2Lkui4drhZWEKVJklljtj" 
      alt="Elevated Floral - The Kopachuck Collection" 
      class="logo"
    >

    <h1>Elevated Floral</h1>
    <p class="tagline">Handcrafted bouquets of dahlias & sunflowers</p>

    <div class="contact-card">
      <div class="contact-item phone">
        Text or call me at<br>
        <a href="tel:4054768676">405-476-8676</a>
      </div>

      <div class="contact-item">
        <a href="mailto:jessica@elevatedfloral.net">jessica@elevatedfloral.net</a>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Elevated Floral · The Kopachuck Collection
  </footer>
</body>
</html>
