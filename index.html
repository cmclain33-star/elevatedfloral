<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elevated Floral | The Kopachuck Collection</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lora:wght@400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Lora', serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      color: #4a3f35;
      position: relative;
      overflow: hidden;
    }

    /* Watercolor flower decorations */
    .flower {
      position: absolute;
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }

    .flower-1 { top: 4%; left: -20px; width: 220px; transform: rotate(-15deg); }
    .flower-2 { top: 8%; right: -30px; width: 200px; transform: rotate(20deg); }
    .flower-3 { bottom: 6%; left: -40px; width: 240px; transform: rotate(10deg); }
    .flower-4 { bottom: 10%; right: -20px; width: 210px; transform: rotate(-25deg); }
    .flower-5 { top: 42%; left: -60px; width: 160px; opacity: 0.4; }
    .flower-6 { top: 38%; right: -50px; width: 150px; opacity: 0.4; }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      max-width: 340px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.8rem;
      display: block;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.06));
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 600;
      color: #5c4a3d;
      margin-bottom: 0.35rem;
    }

    .tagline {
      font-size: 1.05rem;
      color: #7a6a5a;
      margin-bottom: 2.4rem;
      font-style: italic;
    }

    .contact-card {
      background: #fce8ec;
      border-radius: 22px;
      padding: 2rem 1.8rem;
      box-shadow: 0 8px 24px rgba(180, 120, 130, 0.12);
      border: 1px solid #f8d5dc;
    }

    .contact-item {
      margin: 1.1rem 0;
      font-size: 1.15rem;
      line-height: 1.55;
    }

    .contact-item a {
      color: #5c4a3d;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .contact-item a:hover {
      color: #8b5a4a;
      border-bottom-color: #c9a090;
    }

    .phone {
      font-weight: 500;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #9a8a7a;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      .flower-1, .flower-2, .flower-3, .flower-4 {
        width: 150px;
      }
      .flower-5, .flower-6 {
        display: none;
      }
      .logo {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- Watercolor-style Dahlia & Sunflower SVGs -->
  <svg class="flower flower-1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="pink1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f8b4c0"/>
        <stop offset="100%" stop-color="#e88a9a" stop-opacity="0.3"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="45" fill="url(#pink1)"/>
    <circle cx="100" cy="100" r="32" fill="#fce4ec" opacity="0.7"/>
    <circle cx="100" cy="100" r="18" fill="#e91e63" opacity="0.4"/>
  </svg>

  <svg class="flower flower-2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="yellow1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe082"/>
        <stop offset="100%" stop-color="#ffb300" stop-opacity="0.35"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="48" fill="url(#yellow1)"/>
    <circle cx="100" cy="100" r="28" fill="#fff8e1" opacity="0.8"/>
    <circle cx="100" cy="100" r="12" fill="#ff8f00" opacity="0.5"/>
  </svg>

  <svg class="flower flower-3" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="pink2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#f48fb1"/>
        <stop offset="100%" stop-color="#ec407a" stop-opacity="0.3"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="50" fill="url(#pink2)"/>
    <circle cx="100" cy="100" r="35" fill="#fce4ec" opacity="0.6"/>
  </svg>

  <svg class="flower flower-4" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="yellow2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffcc80"/>
        <stop offset="100%" stop-color="#ff9800" stop-opacity="0.35"/>
      </radialGradient>
    </defs>
    <circle cx="100" cy="100" r="46" fill="url(#yellow2)"/>
    <circle cx="100" cy="100" r="26" fill="#fff3e0" opacity="0.75"/>
  </svg>

  <svg class="flower flower-5" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="40" fill="#f8bbd0" opacity="0.5"/>
  </svg>

  <svg class="flower flower-6" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="38" fill="#ffe082" opacity="0.45"/>
  </svg>

  <div class="container">
    <img src="logo.png" alt="Elevated Floral - The Kopachuck Collection" class="logo">

    <h1>Elevated Floral</h1>
    <p class="tagline">Handcrafted bouquets of the finest PNW flowers</p>

    <div class="contact-card">
      <div class="contact-item phone">
        Text or call me at<br>
        <a href="tel:4054768676">405-476-8676</a>
      </div>

      <div class="contact-item">
        <a href="mailto:jessica@elevatedfloral.net">jessica@elevatedfloral.net</a>
      </div>
    </div>
  </div>

  <footer>
    © 2026 Elevated Floral · The Kopachuck Collection
  </footer>
</body>
</html>
